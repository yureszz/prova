name: Gerar instalador SIMCULT (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['simcult/**', '.github/workflows/instalador-windows.yml']

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: simcult
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SIMCULT-instaladores
          path: simcult/dist/SIMCULT-Instalador-*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: simcult-instalador
          target_commitish: ${{ github.sha }}
          name: SIMCULT - Instalador para Windows
          body: |
            Instalador do SIMCULT / SIRMC para Windows 7, 8, 10 e 11.
            Baixe o arquivo **SIMCULT-Instalador-1.0.0-x64.exe**. Ele serve para Windows de 32 e de 64 bits (o instalador escolhe a versão certa sozinho).
            Se o Windows mostrar "O Windows protegeu o computador", clique em Mais informações > Executar assim mesmo.
          files: simcult/dist/SIMCULT-Instalador-*.exe
          overwrite_files: true
          make_latest: true
